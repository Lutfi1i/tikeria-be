basePath: /
definitions:
  dto.CreateEventRequest:
    properties:
      banner_url:
        type: string
      category:
        type: string
      description:
        type: string
      event_date:
        type: string
      location:
        type: string
      tickets:
        items:
          $ref: '#/definitions/dto.TicketInput'
        type: array
      title:
        type: string
    required:
    - category
    - description
    - event_date
    - location
    - tickets
    - title
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
      role:
        enum:
        - buyer
        - partner
        - admin
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.TicketInput:
    properties:
      name:
        type: string
      price:
        minimum: 0
        type: number
      quota:
        type: integer
    required:
    - name
    - price
    - quota
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
  dto.WebResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  models.Event:
    properties:
      banner_url:
        type: string
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      event_date:
        type: string
      id:
        type: integer
      location:
        type: string
      organizer:
        $ref: '#/definitions/models.User'
      organizer_id:
        type: integer
      status:
        type: string
      tickets:
        items:
          $ref: '#/definitions/models.Ticket'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.Ticket:
    properties:
      available:
        type: integer
      created_at:
        type: string
      event_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: number
      quota:
        type: integer
      updated_at:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API RESTful for ticket platform events
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Tikeria Ticketing Platform API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and get JWT Bearer Token
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.WebResponse'
      summary: Login User
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Make new users basically the buyer
      parameters:
      - description: User Registration Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.WebResponse'
      summary: Make new users
      tags:
      - Auth
  /api/v1/events:
    get:
      description: Get all event from list and ticket availability
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Event'
                  type: array
              type: object
      summary: See All Event
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: Make a new Event with the option (Only Partner / Admin)
      parameters:
      - description: Event & Ticket Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Event'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.WebResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.WebResponse'
      security:
      - BearerAuth: []
      summary: Make new Event
      tags:
      - Events
  /api/v1/events/{id}:
    get:
      description: Get Event Detail From ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Event'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.WebResponse'
      summary: Event Detail
      tags:
      - Events
securityDefinitions:
  BearerAuth:
    description: 'Insert your JWT Token: Bearer <jwt_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
